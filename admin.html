<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>De Cirene · Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cirene-theme.css">
<style>
:root {
  --azul: #0A0A0A; --azul-d: #000000; --celeste: #888888; --tinta: #14161A; --tinta-2: #5A5F66; --tinta-3: #9AA0A6;
  --bg: #F5F5F4; --surface: #fff; --surface-2: #FAFAFA; --border: #E2E2E0;
  --rojo: #E63946; --verde: #2BB673; --err-bg: #FCEBEB; --err-text: #791F1F;
  --ok-bg: #E1F5EE; --ok-text: #085041;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Public Sans', system-ui, -apple-system, sans-serif; color: var(--tinta);
  background: var(--bg); font-size: 14px; line-height: 1.45; min-height: 100vh; }
.container { max-width: 1040px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 12px 0; font-family: 'Raleway'; }
h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.subtitle { font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
.tab-bar { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 3px; margin-bottom: 14px; overflow-x: auto; }
.tab-bar button { padding: 8px 14px; border: none; background: transparent; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--tinta-2); border-radius: 7px; cursor: pointer; white-space: nowrap; }
.tab-bar button.active { background: var(--azul); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--tinta); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--azul); color: #fff; border-color: var(--azul); }
.btn.danger { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.fg { margin-bottom: 10px; }
.label { font-size: 11px; font-weight: 600; color: var(--tinta-2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; display: block; }
input, textarea, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; color: var(--tinta); background: #fff; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(0,0,0,0.12); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .row2, .row3 { grid-template-columns: 1fr; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; padding: 8px 10px; color: var(--tinta-2); font-weight: 600;
  border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.tbl tr:last-child td { border-bottom: none; }
.tbl .inactive { opacity: 0.5; }
.tbl input, .tbl select { padding: 5px 7px; font-size: 13px; border-color: transparent; background: transparent; }
.tbl input:focus, .tbl select:focus { border-color: var(--azul); background: #fff; }
.tbl td.num, .tbl th.num { text-align: right; } .tbl td.num input { text-align: right; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--tinta-2); }
.alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
.alert.err { background: var(--err-bg); color: var(--err-text); border-left: 3px solid #A32D2D; }
.alert.ok { background: var(--ok-bg); color: var(--ok-text); border-left: 3px solid #0F6E56; }
.alert.info { background: #EFEFEF; color: #222222; border-left: 3px solid var(--azul); }
.empty { padding: 30px 20px; text-align: center; color: var(--tinta-3); }
code { font-size: 11px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div id="navbar-mount"></div>

<div class="container">
  <h1>Administración</h1>
  <p class="subtitle">Usuarios y roles, operarios y su PIN de taller, cargas sociales, impacto social, etapas y sugerencias.</p>

  <div id="msg"></div>

  <div class="tab-bar">
    <button data-t="operarios" class="active">Operarios</button>
    <button data-t="users">Usuarios</button>
    <button data-t="roles">Roles y permisos</button>
    <button data-t="sugerencias">Sugerencias</button>
    <button data-t="cargas">Cargas sociales</button>
    <button data-t="impacto">Impacto social</button>
    <button data-t="stages">Etapas Kanban</button>
    <button data-t="fields">Campos personalizados</button>
    <button data-t="datos">Importar y datos</button>
  </div>

  <div id="content">Cargando…</div>
</div>

<script type="module">
import { renderNavbar } from './js/navbar.js?v=9';
import { requireAdmin } from './js/auth.js?v=9';
import { getSupa, api } from './js/supa.js?v=9';
import * as data from './js/cirene-data.js?v=9';
import { money, n } from './js/quote-engine.js?v=9';

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fechaHora = (iso) => iso ? new Date(iso).toLocaleString('es-UY', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

const state = {
  tab: 'operarios', operarios: [], cargas: [], impacto: [], stages: [], fields: [],
  users: [], pines: {}, roles: [], sugerencias: [], filtroSug: '', msg: null,
};

function showError(t) { state.msg = { kind: 'err', text: t }; pintarMsg(); }
function showOk(t) { state.msg = { kind: 'ok', text: t }; pintarMsg(); setTimeout(() => { state.msg = null; pintarMsg(); }, 2800); }
function pintarMsg() { $('msg').innerHTML = state.msg ? `<div class="alert ${state.msg.kind}">${esc(state.msg.text)}</div>` : ''; }

async function load() {
  $('content').innerHTML = '<div class="empty">Cargando…</div>';
  try {
    const supa = getSupa();
    if (state.tab === 'operarios') state.operarios = await data.listOperators({ incluirInactivos: true });
    if (state.tab === 'cargas')    state.cargas = await data.listPayrollCharges();
    if (state.tab === 'impacto')   state.impacto = await data.listSocialImpact();
    if (state.tab === 'stages')  { const { data: d } = await supa.from('kanban_stages').select('*').order('display_order'); state.stages = d || []; }
    if (state.tab === 'fields')  { const { data: d } = await supa.from('custom_fields').select('*').order('display_order'); state.fields = d || []; }
    if (state.tab === 'users')   {
      const { data: d } = await supa.from('user_profiles').select('*').order('full_name'); state.users = d || [];
      // Quién tiene PIN (el PIN en sí no viaja nunca) y los números de taller, para no repetirlos.
      const r = await api.pedir('/auth/usuarios/pines');
      state.pines = Object.fromEntries((r.usuarios || []).map(u => [u.id, u]));
      state.operarios = await data.listOperators({ incluirInactivos: false }).catch(() => state.operarios);
    }
    if (state.tab === 'roles')   state.roles = await data.listRoles();
    if (state.tab === 'sugerencias') {
      state.sugerencias = await data.listSuggestions();
      const t = await api.pedir('/admin/tickets').catch(() => ({}));
      state.ticketsActivo = !!t.activo;
    }
  } catch (e) {
    $('content').innerHTML = `<div class="alert err">No se pudo cargar: ${esc(e.message || e)}
      <button class="btn sm" style="margin-left:10px" onclick="location.reload()">Reintentar</button></div>`;
    return;
  }
  render();
}

document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
  state.tab = b.dataset.t;
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('active', x.dataset.t === state.tab));
  load();
});

/* ───────── Operarios ─────────
   Quiénes trabajan en el taller y cuánto cuesta su hora. De acá salen los
   responsables de cada subtarea y el costo real de mano de obra. */
function renderOperarios() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h2>Operarios (${state.operarios.filter(o => o.activo).length} activos)</h2>
      <button class="btn primary" id="btnNewOp">+ Operario</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="tbl">
        <thead><tr><th style="width:22%">Nombre</th><th>Función / rol</th><th class="num" style="width:110px">Costo/hora</th>
          <th style="width:130px">PIN de taller</th>
          <th style="width:18%">Usuario de la app</th><th style="width:120px">Actualizado</th><th style="width:60px">Activo</th><th></th></tr></thead>
        <tbody>${state.operarios.map(o => `
          <tr data-id="${o.id}" class="${o.activo ? '' : 'inactive'}">
            <td><input data-f="nombre" value="${esc(o.nombre)}"></td>
            <td><input data-f="funcion" value="${esc(o.funcion)}" placeholder="Herrero, ayudante…"></td>
            <td class="num"><input data-f="costo_hora" type="number" step="1" value="${n(o.costo_hora)}"></td>
            <td style="white-space:nowrap"><input data-f="pin" value="${esc(o.pin)}" placeholder="— sin PIN —"
                inputmode="numeric" maxlength="8" style="width:62px;text-align:center;font-weight:700;letter-spacing:.12em">
              <button class="btn sm" data-pin title="Generar un PIN libre de 4 dígitos">🎲</button></td>
            <td><select data-f="user_id"><option value="">— sin usuario —</option>
              ${state.users.map(u => `<option value="${u.id}" ${u.id === o.user_id ? 'selected' : ''}>${esc(u.full_name || u.email)}</option>`).join('')}</select></td>
            <td style="font-size:11px;color:var(--tinta-3)">${fechaHora(o.updated_at)}</td>
            <td style="text-align:center"><input type="checkbox" data-f="activo" style="width:auto" ${o.activo ? 'checked' : ''}></td>
            <td style="text-align:right"><button class="btn sm" data-del>✕</button></td>
          </tr>`).join('') || '<tr><td colspan="8" class="empty">Todavía no hay operarios cargados.</td></tr>'}
        </tbody>
      </table>
    </div>
    <div class="alert info"><b>El PIN es la llave del taller.</b> Con esos 4 dígitos el operario entra a
      <a href="/taller.html" target="_blank">/taller.html</a> desde el tablet del taller y marca INICIO y FIN
      de lo que está haciendo. No necesita email ni contraseña, y con el PIN <b>no puede</b> ver precios,
      cotizaciones ni contabilidad: solo fichar. Sin PIN cargado, el operario no puede entrar
      (igual el gerente puede marcarle los tiempos desde Producción).
      ${state.operarios.filter(o => o.activo && !o.pin).length
        ? `<br><b>${state.operarios.filter(o => o.activo && !o.pin).length} operario(s) activo(s) todavía sin PIN.</b>`
        : ''}</div>`;
}
function bindOperarios() {
  $('btnNewOp').onclick = async () => {
    try {
      const o = await data.upsertOperator({ nombre: 'Nuevo operario', costo_hora: 0, activo: true });
      state.operarios.unshift(o); render(); showOk('Operario creado');
    } catch (e) { showError('No se pudo crear: ' + e.message); }
  };
  document.querySelectorAll('#content tbody tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => {
      const o = state.operarios.find(x => x.id === id); if (!o) return;
      const f = el.dataset.f;
      if (f === 'activo') o.activo = el.checked;
      else if (f === 'costo_hora') o.costo_hora = n(el.value);
      else if (f === 'pin') {
        // Solo dígitos, y 4 como mínimo: un PIN de 2 dígitos se adivina de una.
        const limpio = String(el.value || '').replace(/\D+/g, '').slice(0, 8);
        if (limpio && limpio.length < 4) { showError('El PIN necesita al menos 4 números.'); el.value = esc(o.pin || ''); return; }
        o.pin = limpio || null;
        el.value = o.pin || '';
      } else o[f] = el.value || null;
      try {
        const saved = await data.upsertOperator({
          id, nombre: o.nombre, funcion: o.funcion, costo_hora: n(o.costo_hora),
          user_id: o.user_id || null, activo: !!o.activo, pin: o.pin || null,
        });
        Object.assign(o, saved); showOk('Guardado');
      } catch (e) {
        // El índice único del PIN es lo que garantiza que un PIN identifique a
        // UNA persona: si choca, hay que avisar en claro y no dejarlo pasar.
        showError(/pin/i.test(e.message || '')
          ? 'Ese PIN ya lo tiene otro operario. Poné otro.'
          : 'No se pudo guardar: ' + e.message);
        await load();
      }
    });
    const btnPin = tr.querySelector('[data-pin]');
    if (btnPin) btnPin.onclick = async () => {
      const o = state.operarios.find(x => x.id === id); if (!o) return;
      const usados = new Set(state.operarios.map(x => x.pin).filter(Boolean));
      let nuevo = null;
      for (let i = 0; i < 300 && !nuevo; i++) {
        const cand = String(Math.floor(1000 + Math.random() * 9000));
        if (!usados.has(cand)) nuevo = cand;
      }
      if (!nuevo) { showError('No encontré un PIN libre. Poné uno a mano.'); return; }
      try {
        const saved = await data.upsertOperator({
          id, nombre: o.nombre, funcion: o.funcion, costo_hora: n(o.costo_hora),
          user_id: o.user_id || null, activo: !!o.activo, pin: nuevo,
        });
        Object.assign(o, saved); render();
        showOk(`PIN de ${o.nombre}: ${nuevo} — anotalo y dáselo.`);
      } catch (e) { showError('No se pudo generar el PIN: ' + e.message); }
    };
    tr.querySelector('[data-del]').onclick = async () => {
      if (!confirm('¿Eliminar el operario? Si ya tiene horas registradas, mejor desactivalo.')) return;
      try {
        await getSupa().from('operators').delete().eq('id', id);
        state.operarios = state.operarios.filter(x => x.id !== id); render(); showOk('Eliminado');
      } catch (e) { showError('No se pudo eliminar (puede tener trabajo registrado): ' + e.message); }
    };
  });
}

/* ───────── Cargas sociales ─────────
   Parámetros, no reglas del código: se editan acá para adaptarse a las
   obligaciones vigentes sin tocar el frontend. */
function renderCargas() {
  const total = state.cargas.filter(c => c.activo).reduce((s, c) => s + n(c.porcentaje), 0);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h2>Cargas sociales y provisiones</h2>
      <button class="btn primary" id="btnNewCarga">+ Concepto</button>
    </div>
    <div class="card" style="padding:0;">
      <table class="tbl">
        <thead><tr><th style="width:40%">Concepto</th><th class="num" style="width:130px">% sobre nominal</th>
          <th>Notas</th><th style="width:140px">Actualizado</th><th style="width:70px">Activo</th></tr></thead>
        <tbody>${state.cargas.map(c => `
          <tr data-id="${c.id}" class="${c.activo ? '' : 'inactive'}">
            <td><input data-f="nombre" value="${esc(c.nombre)}"></td>
            <td class="num"><input data-f="porcentaje" type="number" step="0.01" value="${n(c.porcentaje)}"></td>
            <td><input data-f="notas" value="${esc(c.notas)}"></td>
            <td style="font-size:11px;color:var(--tinta-3)">${fechaHora(c.updated_at)}</td>
            <td style="text-align:center"><input type="checkbox" data-f="activo" style="width:auto" ${c.activo ? 'checked' : ''}></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="alert info">Total activo: <b>${total.toFixed(2)}%</b> sobre el salario nominal.
      Contabilidad usa este porcentaje para calcular las cargas de cada sueldo.</div>`;
}
function bindCargas() {
  $('btnNewCarga').onclick = async () => {
    try {
      const c = await data.upsertPayrollCharge({ nombre: 'Nuevo concepto ' + (state.cargas.length + 1), porcentaje: 0, display_order: (state.cargas.length + 1) * 10, activo: true });
      state.cargas.push(c); render(); showOk('Concepto creado');
    } catch (e) { showError('No se pudo crear (el nombre no puede repetirse): ' + e.message); }
  };
  document.querySelectorAll('#content tbody tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => {
      const c = state.cargas.find(x => x.id === id); if (!c) return;
      const f = el.dataset.f;
      c[f] = f === 'activo' ? el.checked : (f === 'porcentaje' ? n(el.value) : el.value);
      try {
        const saved = await data.upsertPayrollCharge({ id, nombre: c.nombre, porcentaje: n(c.porcentaje), notas: c.notas || null, activo: !!c.activo });
        Object.assign(c, saved); render(); showOk('Guardado');
      } catch (e) { showError('No se pudo guardar: ' + e.message); }
    });
  });
}

/* ───────── Impacto social ─────────
   Bloque manual con histórico por fecha para poder mostrar la evolución. */
function renderImpacto() {
  const ultimo = state.impacto[0] || {};
  return `
    <div class="card">
      <h2>Personas en la herrería</h2>
      <p class="subtitle">De Cirene genera oportunidades de inserción laboral. Estos dos números se cargan a mano y alimentan el Dashboard.</p>
      <div class="row3" style="margin-top:12px">
        <div class="fg"><label class="label">Fecha del registro</label><input id="i-fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="fg"><label class="label">Personas que pasaron (histórico)</label><input id="i-hist" type="number" min="0" value="${n(ultimo.personas_historico)}"></div>
        <div class="fg"><label class="label">Personas actualmente en proceso</label><input id="i-act" type="number" min="0" value="${n(ultimo.personas_actuales)}"></div>
      </div>
      <div class="fg"><label class="label">Notas</label><input id="i-notas" placeholder="(opcional)"></div>
      <button class="btn primary" id="btnImpacto">Guardar registro</button>
    </div>
    <div class="card" style="padding:0">
      <table class="tbl">
        <thead><tr><th>Fecha</th><th class="num">Histórico</th><th class="num">En proceso</th><th>Notas</th></tr></thead>
        <tbody>${state.impacto.map(r => `<tr>
          <td>${esc(r.fecha)}</td><td class="num">${r.personas_historico}</td>
          <td class="num">${r.personas_actuales}</td><td>${esc(r.notas)}</td></tr>`).join('')
          || '<tr><td colspan="4" class="empty">Sin registros todavía.</td></tr>'}</tbody>
      </table>
    </div>`;
}
function bindImpacto() {
  $('btnImpacto').onclick = async () => {
    const btn = $('btnImpacto'); btn.disabled = true;
    try {
      await data.saveSocialImpact({
        fecha: $('i-fecha').value, personas_historico: $('i-hist').value,
        personas_actuales: $('i-act').value, notas: $('i-notas').value,
      });
      state.impacto = await data.listSocialImpact();
      render(); showOk('Registro guardado');
    } catch (e) { showError('No se pudo guardar: ' + e.message); }
    finally { btn.disabled = false; }
  };
}

/* ───────── Etapas y campos (consulta) ───────── */
function renderStages() {
  const byCat = {};
  for (const s of state.stages) (byCat[s.category] ||= []).push(s);
  return `<div class="card"><h2>Etapas del kanban</h2>
    <p class="subtitle">Columnas del CRM y de Producción. Se agregan desde <code>db/schema.sql</code> para que queden versionadas.</p>
    ${Object.keys(byCat).map(cat => `
      <h3 style="margin-top:14px;font-size:13px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:0.04em;">${esc(cat)}</h3>
      <table class="tbl"><thead><tr><th>Key</th><th>Etiqueta</th><th class="num">Orden</th><th>Activa</th></tr></thead>
      <tbody>${byCat[cat].map(s => `<tr class="${s.active ? '' : 'inactive'}">
        <td><code>${esc(s.key)}</code></td><td>${esc(s.label)}</td>
        <td class="num">${s.display_order}</td><td>${s.active ? '✓' : '—'}</td></tr>`).join('')}</tbody></table>`).join('')}
    </div>`;
}
function renderFields() {
  const byApp = {};
  for (const f of state.fields) (byApp[f.applies_to] ||= []).push(f);
  const claves = Object.keys(byApp);
  return `<div class="card"><h2>Campos personalizados</h2>
    <p class="subtitle">Campos extra de las tarjetas. Se definen en <code>db/schema.sql</code>.</p>
    ${claves.length ? claves.map(applies => `
      <h3 style="margin-top:14px;font-size:13px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:0.04em;">${esc(applies)}</h3>
      <table class="tbl"><thead><tr><th>Key</th><th>Etiqueta</th><th>Tipo</th><th>Requerido</th></tr></thead>
      <tbody>${byApp[applies].map(f => `<tr class="${f.active ? '' : 'inactive'}">
        <td><code>${esc(f.field_key)}</code></td><td>${esc(f.label)}</td>
        <td><span class="badge">${esc(f.field_type)}</span></td><td>${f.required ? '✓' : '—'}</td></tr>`).join('')}</tbody></table>`).join('')
      : '<div class="empty">No hay campos personalizados definidos.</div>'}
    </div>`;
}

/* ───────── Usuarios ─────────

// Los roles ya no son una lista fija en el código: salen de la tabla `app_roles`.
// Si por lo que sea la tabla no cargó, se muestran los cuatro originales para no
// dejar la pantalla sin poder asignar rol.
function opcionesDeRol(actual) {
  const rs = state.roles.length
    ? state.roles.filter(r => r.activo !== false || r.key === actual)
    : [{ key: 'comercial', label: 'Comercial' }, { key: 'produccion', label: 'Producción' },
       { key: 'admin', label: 'Administrador' }, { key: 'director', label: 'Director' }];
  const hay = rs.some(r => r.key === actual);
  return (hay ? rs : [...rs, { key: actual, label: actual + ' (rol que ya no existe)' }])
    .map(r => `<option value="${esc(r.key)}" ${r.key === actual ? 'selected' : ''}>${esc(r.label)}</option>`).join('');
}
// Un PIN al azar que no sea el de un operario (los de usuarios no se pueden
// leer: si justo choca con uno, el servidor lo rechaza y se tira de nuevo).
function pinAlAzar() {
  const usados = new Set((state.operarios || []).map(o => o.pin).filter(Boolean));
  let p;
  do { p = String(Math.floor(Math.random() * 10000)).padStart(4, '0'); } while (usados.has(p));
  return p;
}
function textoError(e) { return typeof e === 'string' ? e : (e?.message || 'error'); }

function bindUsers() {
  $('u-pin-dado').onclick = () => { $('u-pin').value = pinAlAzar(); };
  $('btnNewUser').onclick = async () => {
    const nombre = $('u-nombre').value.trim();
    const pin = $('u-pin').value.trim();
    const email = $('u-email').value.trim().toLowerCase();
    if (!nombre) { showError('Falta el nombre'); return; }
    if (!/^\d{4}$/.test(pin)) { showError('El PIN tiene que ser de 4 números (o tocá 🎲)'); return; }
    const btn = $('btnNewUser'); btn.disabled = true;
    try {
      const r = await api.pedir('/auth/usuarios', {
        method: 'POST',
        body: JSON.stringify({ email: email || null, full_name: nombre, role: $('u-rol').value, pin }),
      });
      if (r.error) throw new Error(textoError(r.error));
      await load();
      $('u-result').innerHTML = `<div class="alert ok" style="margin-top:12px"><b>${esc(nombre)}</b> creado.
        Su PIN es <code style="font-size:15px">${esc(pin)}</code> — anotalo y dáselo ahora, después no se puede ver.
        ${r.password ? `<br>Para entrar con email: <b>${esc(r.email)}</b> y la contraseña
        <code style="font-size:14px">${esc(r.password)}</code> (la cambia al entrar).` : ''}</div>`;
    } catch (e) { showError('No se pudo crear: ' + e.message); }
    finally { btn.disabled = false; }
  };
  document.querySelectorAll('#content tbody tr[data-uid]').forEach(tr => {
    const id = tr.dataset.uid;
    const inp = tr.querySelector('[data-pin]');
    tr.querySelector('[data-pin-dado]').onclick = () => { inp.value = pinAlAzar(); };
    tr.querySelector('[data-pin-ok]').onclick = async (ev) => {
      const pin = inp.value.trim();
      if (!/^\d{4}$/.test(pin)) { showError('El PIN tiene que ser de 4 números (o tocá 🎲)'); return; }
      const nombre = tr.querySelector('[data-f="full_name"]').value;
      ev.target.disabled = true;
      try {
        const r = await api.pedir('/auth/usuarios/pin', { method: 'POST', body: JSON.stringify({ id, pin }) });
        if (r.error) throw new Error(textoError(r.error));
        await load();
        showOk(`PIN de ${nombre}: ${pin} — anotalo y dáselo, después no se puede ver.`);
      } catch (e) { showError('No se pudo guardar el PIN: ' + e.message); ev.target.disabled = false; }
    };
  });
  document.querySelectorAll('#content tbody tr[data-uid]').forEach(tr => {
    const id = tr.dataset.uid;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => {
      const patch = {};
      const f = el.dataset.f;
      patch[f] = f === 'active' ? el.checked : el.value;
      try {
        const { error } = await getSupa().from('user_profiles').update(patch).eq('id', id);
        if (error) throw new Error(error.message);
        showOk('Guardado');
      } catch (e) { showError('No se pudo guardar: ' + e.message); }
    });
  });
}


/* ───────── Roles y permisos ─────────
   Un rol tiene dos partes, y la distinción es importante:

     · PERFIL BASE → de dónde saca los permisos de BASE DE DATOS. Son cuatro y
       viven en el servidor (api/registry.js). No se editan desde acá a propósito:
       si esta pantalla pudiera dar permisos de tabla, cualquiera que la abriera
       podría regalarse la contabilidad.
     · MÓDULOS → qué pantallas ve en el menú. Eso sí es configurable, porque es
       una decisión de organización, no de seguridad.

   O sea: los módulos deciden qué VE, el perfil base decide qué PUEDE. */
function renderRoles() {
  const usuariosPorRol = {};
  state.users.forEach(u => { usuariosPorRol[u.role] = (usuariosPorRol[u.role] || 0) + 1; });

  return `

      <p class="subtitle">Por ejemplo "Encargado de taller" o "Administrativo". Después elegís qué módulos ve.</p>

      </div>

      <div id="r-result"></div>
    </div>

    ${state.roles.map(r => {
      const mods = Array.isArray(r.modulos) ? r.modulos : [];
      const perfil = data.PERFILES_BASE.find(p => p.key === r.perfil_base);
      return `<div class="card" data-rol="${esc(r.key)}">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <h2 style="margin:0">${esc(r.label)}</h2>
          <code>${esc(r.key)}</code>
          ${r.sistema ? '<span class="badge">del sistema</span>' : ''}
          ${r.activo ? '' : '<span class="badge">desactivado</span>'}
          <span class="badge">${usuariosPorRol[r.key] || 0} usuario(s)</span>
          <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
            <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600">
              <input type="checkbox" data-r-activo style="width:auto" ${r.activo ? 'checked' : ''}> Activo</label>
            ${r.sistema ? '' : '<button class="btn sm" data-r-del>✕ Eliminar</button>'}
          </div>
        </div>
        ${r.descripcion ? `<p class="subtitle" style="margin-bottom:10px">${esc(r.descripcion)}</p>` : ''}
        <div class="row2">
          <div class="fg"><label class="label">Nombre visible</label><input data-r-label value="${esc(r.label)}"></div>
          <div class="fg"><label class="label">Permisos de base de datos</label>
            <select data-r-perfil ${r.key === 'admin' ? 'disabled' : ''}>
              ${data.PERFILES_BASE.map(p => `<option value="${p.key}" ${p.key === r.perfil_base ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}
            </select>
            <p class="subtitle" style="margin-top:4px">${esc(perfil ? perfil.desc : '')}</p>
          </div>
        </div>
        <label class="label" style="margin-top:6px">Módulos que ve este rol (${mods.length} de ${data.MODULOS.length})</label>
        ${[...data.AREAS, { id: null, label: 'Generales' }].map(a => `
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-3);margin:8px 0 4px">${esc(a.label)}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px 14px;margin-bottom:6px">

            <input type="checkbox" data-r-mod="${m.id}" style="width:auto;margin-top:3px" ${mods.includes(m.id) ? 'checked' : ''}>
            <span>${esc(m.label)}<span style="display:block;font-weight:400;font-size:11px;color:var(--tinta-3)">${esc(m.desc)}</span></span>

function bindRoles() {
  $('btnNewRole').onclick = async () => {
    const label = $('r-label').value.trim();
    if (!label) { showError('Ponele un nombre al rol'); return; }
    const key = data.claveRol(label);
    if (!key) { showError('Ese nombre no sirve como identificador. Usá letras.'); return; }
    if (state.roles.some(r => r.key === key)) { showError('Ya existe un rol con ese nombre.'); return; }
    const btn = $('btnNewRole'); btn.disabled = true;
    try {
      await data.upsertRole({
        key, label, perfil_base: $('r-perfil').value,
        descripcion: $('r-desc').value.trim() || null,
        // Arranca con lo mínimo y el admin marca lo que corresponda: es más
        // seguro que dar todo y esperar que alguien se acuerde de sacarlo.
        modulos: ['home', 'manual'], activo: true, sistema: false,
      });
      $('r-label').value = ''; $('r-desc').value = '';
      showOk(`Rol "${label}" creado (${key}). Marcale los módulos y guardá.`);
      await load();
    } catch (e) { showError('No se pudo crear: ' + e.message); }
    finally { btn.disabled = false; }
  };

  document.querySelectorAll('[data-rol]').forEach(tarjeta => {
    const key = tarjeta.dataset.rol;
    const rol = state.roles.find(r => r.key === key);
    if (!rol) return;
    const marcar = (val) => tarjeta.querySelectorAll('[data-r-mod]').forEach(c => { c.checked = val; });

    tarjeta.querySelector('[data-r-todos]').onclick = () => marcar(true);
    tarjeta.querySelector('[data-r-ninguno]').onclick = () => marcar(false);

    tarjeta.querySelector('[data-r-save]').onclick = async () => {
      const btn = tarjeta.querySelector('[data-r-save]'); btn.disabled = true;
      const modulos = [...tarjeta.querySelectorAll('[data-r-mod]')].filter(c => c.checked).map(c => c.dataset.rMod);
      try {
        const saved = await data.upsertRole({
          key,
          label: tarjeta.querySelector('[data-r-label]').value.trim() || rol.label,
          perfil_base: tarjeta.querySelector('[data-r-perfil]').value,
          modulos,
          activo: tarjeta.querySelector('[data-r-activo]').checked,
          descripcion: rol.descripcion || null,
        });
        Object.assign(rol, saved);
        showOk('Rol guardado. Los usuarios lo ven al recargar la página.');
        render();
      } catch (e) { showError('No se pudo guardar: ' + e.message); btn.disabled = false; }
    };

    const del = tarjeta.querySelector('[data-r-del]');
    if (del) del.onclick = async () => {
      if (!confirm(`¿Eliminar el rol "${rol.label}"?`)) return;
      try { await data.deleteRole(key); showOk('Rol eliminado'); await load(); }
      catch (e) { showError(e.message); }
    };
  });
}

        ? `<p class="subtitle" style="margin-top:6px">Cada una se envía sola como <b>ticket a customERP</b>, que mantiene esta app.
            <button class="btn sm" id="btnTickets" style="margin-left:6px">Reintentar las pendientes</button></p>`
        : `<p class="subtitle" style="margin-top:6px">El envío a customERP todavía no está conectado: las sugerencias quedan

    </div>

    ${filtradas.length ? filtradas.map(s => {

          <span class="badge">${esc(est.label)}</span>
          ${s.ticket_estado === 'enviada' ? `<span class="badge" title="Ticket ${esc(s.ticket_id || '')}">✓ en customERP</span>`
            : s.ticket_estado === 'error' ? `<span class="badge" style="color:var(--rojo)" title="${esc(s.ticket_error || '')}">sin enviar · se reintenta</span>`
            : state.ticketsActivo ? '<span class="badge">enviando…</span>' : ''}
          <span style="font-size:12px;color:var(--tinta-3);margin-left:auto">
            ${esc(s.user_label || 'Alguien')} · ${fechaHora(s.created_at)}</span>
        </div>
        <div style="font-size:14px;line-height:1.55;white-space:pre-wrap">${esc(s.texto)}</div>
        ${adj.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          ${adj.map(f => (f.type || '').startsWith('image/')

                 style="width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"></a>`
            : `<a class="btn sm" href="${esc(f.url)}" target="_blank">📄 ${esc((f.name || 'archivo').slice(0, 18))}</a>`).join('')}

function bindSugerencias() {
  if ($('btnTickets')) $('btnTickets').onclick = async () => {

      const r = await api.pedir('/admin/tickets', { method: 'POST' });
      if (r.error) throw new Error(textoError(r.error));
      showOk(`Enviadas: ${r.enviadas} · con error: ${r.errores}`);

  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    state.filtroSug = b.dataset.fs; render();

    const id = tarjeta.dataset.sug;
    tarjeta.querySelector('[data-s-save]').onclick = async () => {
      const btn = tarjeta.querySelector('[data-s-save]'); btn.disabled = true;

/* ───────── Datos de prueba y reinicio ─────────

      <p class="subtitle">Carga los dos CSV que exporta Asana: <b>Presupuestos Herreria</b> (pasa al CRM) y
        <b>Herreria Operativa</b> (pasa a Producción, con su venta). Arma los clientes, une la consulta con su
        trabajo cuando es la misma tarea y lee los productos y precios de la tabla de cada tarea.</p>
      <p class="subtitle" style="margin-top:8px"><b>Reemplaza todo el movimiento</b>, igual que "Reiniciar todo".
        Antes de borrar se guarda un respaldo de lo que había. Primero tocá <b>Ver qué se va a cargar</b>: no
        cambia nada y te muestra el resultado.</p>
      <div class="row2" style="margin-top:12px">
        <div class="fg"><label class="label">Presupuestos Herreria (.csv)</label><input type="file" id="csv-pres" accept=".csv,text/csv"></div>
        <div class="fg"><label class="label">Herreria Operativa (.csv)</label><input type="file" id="csv-oper" accept=".csv,text/csv"></div>
      </div>
      <button class="btn" id="btnVerAsana">Ver qué se va a cargar</button>
      <div id="asana-plan"></div>
      <div id="asana-confirmar" style="display:none">
        <div class="row2" style="align-items:end;margin-top:12px">
          <div class="fg"><label class="label">Escribí REINICIAR para habilitar el botón</label>
            <input id="conf-asana" placeholder="REINICIAR" autocomplete="off"></div>
          <div class="fg"><button class="btn danger" id="btnAsana" disabled>Borrar todo y cargar</button></div>
        </div>
      </div>
      <div id="asana-result"></div>
    </div>

    <div class="card">
      <h2>Cargar datos de prueba</h2>
      <p class="subtitle">Genera un juego de datos ficticio pero coherente, que recorre todos los módulos:
        clientes, leads en distintas etapas, cotizaciones (incluida una en borrador), dos leads ganados con su
        venta, su pedido en producción y su cuenta a cobrar, subtareas con horas fichadas, una orden de compra
        recibida con su movimiento de stock y su gasto, cobros, activos, impacto social y encuestas NPS.</p>
      <p class="subtitle" style="margin-top:8px">Todo queda marcado como <code>demo</code>, así que después se
        puede borrar sin tocar nada real.</p>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn primary" id="btnDemo">Generar datos de prueba</button>
        <button class="btn" id="btnBorrarDemo">Borrar solo los datos de prueba</button>
      </div>
      <div id="demo-result"></div>
    </div>

    <div class="card" style="border-color:var(--rojo)">
      <h2 style="color:var(--rojo)">Reiniciar y empezar de cero</h2>
      <p class="subtitle">Borra <b>todo el movimiento</b>: clientes, leads, cotizaciones, ventas, pedidos de
        producción, subtareas, órdenes de compra, movimientos de stock, cuentas a cobrar, cobros, gastos,
        activos y encuestas. Los saldos de stock y de proveedores vuelven a cero.</p>
      <p class="subtitle" style="margin-top:8px"><b>Se conservan</b>: usuarios, catálogo (materiales,
        terminaciones, mano de obra, plantillas), proveedores, operarios, etapas del kanban y cargas sociales.</p>
      <div class="alert err" style="margin-top:12px">Esto no se puede deshacer. No hay papelera ni respaldo automático.</div>
      <div class="row2" style="align-items:end">
        <div class="fg"><label class="label">Escribí REINICIAR para habilitar el botón</label>
          <input id="conf-reset" placeholder="REINICIAR" autocomplete="off"></div>
        <div class="fg"><button class="btn danger" id="btnReset" disabled>Reiniciar todo</button></div>
      </div>
      <div id="reset-result"></div>
    </div>`;
}
function bindDatos() {
  const resumen = (obj) => Object.entries(obj || {}).map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: <b>${v}</b>`).join(' · ') || 'nada';

  /* ── Importar desde Asana (POST /api/admin/importar-asana, ver api/asana.js) ── */
  const NOMBRES = {
    clients: 'clientes', intake_cards: 'consultas', quotes: 'cotizaciones', quote_lines: 'líneas de cotización',
    sales: 'ventas', production_cards: 'trabajos', production_subtasks: 'subtareas', subtask_time_logs: 'fichadas',
    receivables: 'cuentas a cobrar', job_payments: 'cobros', cash_movements: 'movimientos de caja', cash_sessions: 'cajas',
    expenses: 'gastos', supplier_ledger: 'cuenta corriente de proveedores', stock_movements: 'movimientos de stock',
    purchase_orders: 'órdenes de compra', purchase_order_lines: 'líneas de órdenes de compra', card_stories: 'comentarios',
    notifications: 'avisos', production_card_transitions: 'cambios de etapa', nps_surveys: 'encuestas NPS',
    production_weeks: 'semanas planificadas', production_days: 'días planificados', assets: 'activos', social_impact: 'impacto social',
  };
  const enCastellano = (obj) => Object.fromEntries(Object.entries(obj || {}).map(([k, v]) => [NOMBRES[k] || k, v]));
  async function leerArchivos() {
    const fp = $('csv-pres').files[0], fo = $('csv-oper').files[0];
    if (!fp && !fo) throw new Error('Elegí los dos archivos CSV de Asana.');
    return { presupuestos: fp ? await fp.text() : '', operativa: fo ? await fo.text() : '' };
  }
  const mostrarPlan = (r, final) => `
    <div class="alert ${final ? 'ok' : 'info'}" style="margin-top:12px">
      <b>${final ? 'Listo, quedó cargado' : 'Esto es lo que va a pasar'}</b><br>
      Se ${final ? 'cargaron' : 'cargan'}: ${resumen(r.carga)}<br>
      Se ${final ? 'borraron' : 'borran'}: ${resumen(enCastellano(r.borra))}
      ${r.respaldo ? `<br>Respaldo de lo anterior: <code>${esc(r.respaldo)}</code>` : ''}
    </div>
    ${r.sinPrecio ? `<p class="subtitle" style="margin-top:8px">${r.sinPrecio} trabajo(s) quedan <b>sin precio</b>
      (en Asana no tenían): en Producción aparecen marcados para completarlo.</p>` : ''}
    ${(r.avisos || []).length ? `<div class="alert err" style="margin-top:8px"><b>Para revisar</b><ul style="margin:6px 0 0 18px">
      ${r.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
    ${(r.stock || []).length ? `<p class="subtitle" style="margin-top:8px"><b>No se importa la sección Stock</b>
      (${r.stock.length} productos terminados): el stock del sistema es de materiales.
      ${r.stock.map(s => `${esc(s.producto)} (${s.actual ?? '?'})`).join(' · ')}</p>` : ''}`;

  $('btnVerAsana').onclick = async () => {
    const b = $('btnVerAsana'); b.disabled = true; b.textContent = 'Leyendo…';
    $('asana-result').innerHTML = '';
    try {
      const r = await api.pedir('/admin/importar-asana', { method: 'POST', body: JSON.stringify({ ...(await leerArchivos()), soloVer: true }) });
      if (r.error) throw new Error(r.error);
      $('asana-plan').innerHTML = mostrarPlan(r, false);
      $('asana-confirmar').style.display = '';
    } catch (e) { $('asana-plan').innerHTML = `<div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>`; }
    finally { b.disabled = false; b.textContent = 'Ver qué se va a cargar'; }
  };
  $('conf-asana').oninput = e => { $('btnAsana').disabled = e.target.value.trim().toUpperCase() !== 'REINICIAR'; };
  $('btnAsana').onclick = async () => {
    if (!confirm('Se borra todo el movimiento actual y se carga lo de Asana.\n\nQueda un respaldo de lo anterior. ¿Seguís?')) return;
    const b = $('btnAsana'); b.disabled = true; b.textContent = 'Cargando…';
    try {
      const r = await api.pedir('/admin/importar-asana', {
        method: 'POST', body: JSON.stringify({ ...(await leerArchivos()), confirmacion: $('conf-asana').value }),
      });
      if (r.error) throw new Error(r.error);
      $('asana-plan').innerHTML = '';
      $('asana-confirmar').style.display = 'none';
      $('conf-asana').value = '';
      $('asana-result').innerHTML = mostrarPlan(r, true);
      showOk('Datos de Asana cargados');
    } catch (e) { $('asana-result').innerHTML = `<div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>`; }
    finally { b.textContent = 'Borrar todo y cargar'; }
  };

  $('btnDemo').onclick = async () => {
    const b = $('btnDemo'); b.disabled = true; b.textContent = 'Generando…';
    try {
      const r = await api.pedir('/admin/demo', { method: 'POST' });
      if (r.error) throw new Error(r.error);
      $('demo-result').innerHTML = `<div class="alert ok" style="margin-top:12px">Datos de prueba cargados · ${resumen(r.cuenta)}</div>`;
      showOk('Datos de prueba cargados');
    } catch (e) { $('demo-result').innerHTML = `<div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>`; }
    finally { b.disabled = false; b.textContent = 'Generar datos de prueba'; }
  };

  $('btnBorrarDemo').onclick = async () => {
    if (!confirm('¿Borrar los datos de prueba? Lo real no se toca.')) return;
    const b = $('btnBorrarDemo'); b.disabled = true; b.textContent = 'Borrando…';
    try {
      const r = await api.pedir('/admin/reset', { method: 'POST', body: JSON.stringify({ modo: 'demo' }) });
      if (r.error) throw new Error(r.error);
      $('demo-result').innerHTML = `<div class="alert ok" style="margin-top:12px">Datos de prueba borrados · ${resumen(r.borrados)}</div>`;
      showOk('Datos de prueba borrados');
    } catch (e) { $('demo-result').innerHTML = `<div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>`; }
    finally { b.disabled = false; b.textContent = 'Borrar solo los datos de prueba'; }
  };

  $('conf-reset').oninput = e => { $('btnReset').disabled = e.target.value.trim().toUpperCase() !== 'REINICIAR'; };
  $('btnReset').onclick = async () => {
    if (!confirm('Última confirmación.\n\nSe borra TODO el movimiento de la herrería y no se puede deshacer.\n\n¿Seguís?')) return;
    const b = $('btnReset'); b.disabled = true; b.textContent = 'Reiniciando…';
    try {
      const r = await api.pedir('/admin/reset', {
        method: 'POST', body: JSON.stringify({ modo: 'operativo', confirmacion: $('conf-reset').value }),
      });
      if (r.error) throw new Error(r.error);
      $('reset-result').innerHTML = `<div class="alert ok" style="margin-top:12px">Listo, arrancás de cero · ${resumen(r.borrados)}</div>`;
      $('conf-reset').value = '';
      showOk('Sistema reiniciado');
    } catch (e) { $('reset-result').innerHTML = `<div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>`; }
    finally { b.textContent = 'Reiniciar todo'; }
  };
}

function render() {
  renderNavbar('admin');
  pintarMsg();
  if (state.tab === 'datos') { $('content').innerHTML = renderDatos(); bindDatos(); }
  else if (state.tab === 'operarios') { $('content').innerHTML = renderOperarios(); bindOperarios(); }
  else if (state.tab === 'cargas')  { $('content').innerHTML = renderCargas(); bindCargas(); }
  else if (state.tab === 'impacto') { $('content').innerHTML = renderImpacto(); bindImpacto(); }
  else if (state.tab === 'stages')  { $('content').innerHTML = renderStages(); }
  else if (state.tab === 'fields')  { $('content').innerHTML = renderFields(); }
  else if (state.tab === 'users')   { $('content').innerHTML = renderUsers(); bindUsers(); }
  else if (state.tab === 'roles')   { $('content').innerHTML = renderRoles(); bindRoles(); }
  else if (state.tab === 'sugerencias') { $('content').innerHTML = renderSugerencias(); bindSugerencias(); }
}

(async () => {
  if (!(await requireAdmin())) return;
  // Los operarios se enlazan con usuarios y los usuarios con roles: las dos
  // listas se precargan siempre, porque las usan varias pestañas a la vez.
  try { const { data: d } = await getSupa().from('user_profiles').select('*').order('full_name'); state.users = d || []; } catch {}
  try { state.roles = await data.listRoles(); } catch {}
  await load();
})();
</script>
