<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>De Cirene · Contabilidad</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cirene-theme.css">
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 20px 80px; }
  .tabbar { display: inline-flex; gap: 4px; background: var(--surface-3); padding: 3px; border-radius: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabbar button { border: none; background: transparent; padding: 8px 16px; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tinta-2); cursor: pointer; }
  .tabbar button.active { background: #0A0A0A; color: #fff; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th { text-align: left; padding: 8px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-2); border-bottom: 1px solid var(--border); }
  table.grid td { padding: 7px 8px; border-bottom: 1px solid var(--surface-3); }
  td.num, th.num { text-align: right; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-2); background: #fff; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn.primary { background: #0A0A0A; color: #fff; border-color: #0A0A0A; }
  .btn.green { background: #2E7D46; color: #fff; border-color: #2E7D46; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .kpis { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi { background: #0A0A0A; color: #fff; border-radius: 12px; padding: 14px 20px; min-width: 150px; }
  .kpi span { display: block; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  .kpi b { font-size: 24px; }
  .pay { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .pay-NO { background: #FDECEE; color: #A33A3A; } .pay-SEÑA { background: #FAEFD6; color: #8A6D1B; } .pay-SI { background: #E1F5EE; color: #1F6B45; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; }
  .ov.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 420px; padding: 22px 24px; }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .fg { margin-bottom: 11px; } .fg label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--tinta-2); margin-bottom: 4px; }
  .fg input, .fg select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .muted { color: var(--tinta-3); font-size: 12px; }
  /* calendario de cobros */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { font-size: 10px; text-transform: uppercase; color: var(--tinta-3); text-align: center; padding: 4px; font-weight: 700; }
  .cal .day { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; min-height: 78px; padding: 4px 5px; }
  .cal .day.empty { background: transparent; border: none; }
  .cal .day .dn { font-size: 11px; color: var(--tinta-3); font-weight: 700; }
  .cal .day.today { border-color: #0A0A0A; box-shadow: 0 0 0 1px #0A0A0A; }
  .cal .ev { color: #fff; border-radius: 5px; padding: 2px 5px; font-size: 10px; margin-top: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--tinta-2); margin-top: 10px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
  .kpi span { display: block; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0A0A0A; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="navbar-mount"></div>
<div class="wrap">
  <h1 style="font-family:'Raleway';margin-bottom:14px">Contabilidad</h1>
  <div class="tabbar">
    <button data-tab="cuentas" class="active">Cuentas a cobrar</button>
    <button data-tab="calcobros">Calendario de cobros</button>
    <button data-tab="cobros">Cobros por trabajo</button>
    <button data-tab="gastos">Gastos</button>
    <button data-tab="reintegros">Reintegros</button>
    <button data-tab="ctacte">Cuenta corriente</button>
    <button data-tab="activos">Activos</button>
    <button data-tab="caja">Caja del día</button>
    <button data-tab="mov">Movimientos</button>
    <button data-tab="balance">Balance</button>
  </div>
  <div id="pane"></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script type="module">
import { renderNavbar } from './js/navbar.js?v=5';
import { requireAuth, isAdmin } from './js/auth.js?v=5';
import * as data from './js/cirene-data.js?v=5';
import { money, n } from './js/quote-engine.js?v=5';

const $ = s => document.querySelector(s);
const pane = $('#pane');
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1900); };
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);

await requireAuth();
renderNavbar('contabilidad');
if (!(await isAdmin())) { pane.innerHTML = '<div class="card">Esta sección es solo para administración.</div>'; document.querySelector('.tabbar').style.display = 'none'; }
else { document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('active', x === b)); render(b.dataset.tab); }); render('cuentas'); }

// `function` y no `const`: el render de la primera pestaña se dispara arriba,
// antes de esta línea, y un `const` todavía no existiría (la pantalla quedaba
// en blanco sin ningún mensaje).
function fail(e, ctx) { console.error('[contabilidad]', ctx || '', e); toast((ctx ? ctx + ': ' : '') + (e?.message || e)); }
async function guard(fn) {
  pane.innerHTML = '<div class="card">Cargando…</div>';
  try { await fn(); }
  catch (e) {
    console.error('[contabilidad]', e);
    pane.innerHTML = `<div class="card" style="color:#A33A3A">No se pudo cargar.<br><span class="muted">${esc(e.message || e)}</span>
      <br><button class="btn" style="margin-top:10px" onclick="location.reload()">Reintentar</button></div>`;
  }
}

function render(tab) {
  ({
    cuentas: () => guard(renderCuentas), calcobros: () => guard(renderCalCobros),
    cobros: () => guard(renderCobros), gastos: () => guard(renderGastos),
    reintegros: () => guard(renderReintegros), ctacte: () => guard(renderCtaCte),
    activos: () => guard(renderActivos), caja: () => guard(renderCaja),
    mov: () => guard(renderMov), balance: () => guard(renderBalance),
  }[tab] || (() => guard(renderCuentas)))();
}

/* ── Caja del día ── */
async function renderCaja() {
  pane.innerHTML = '<div class="card">Cargando…</div>';
  const ses = await data.getOpenSession();
  if (!ses) {
    pane.innerHTML = `<div class="card"><h2 style="font-size:15px;margin-bottom:10px">No hay caja abierta</h2>
      <div class="toolbar"><label class="muted">Saldo inicial $</label><input id="ci" type="number" value="0" style="width:120px">
      <button class="btn primary" id="abrir">Abrir caja de hoy</button></div></div>`;
    $('#abrir').onclick = async () => { await data.openCashSession(n($('#ci').value), today()); toast('Caja abierta'); renderCaja(); };
    return;
  }
  const movs = await data.listCashMovements({ sessionId: ses.id });
  let ing = 0, egr = 0; movs.forEach(m => m.tipo === 'ingreso' ? ing += n(m.monto) : egr += n(m.monto));
  const saldo = n(ses.saldo_inicial) + ing - egr;
  pane.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div><b>Caja abierta</b> · ${ses.fecha}</div><button class="btn" id="cerrar">Cerrar caja</button></div>
    <div class="kpis">
      <div class="kpi"><span>Saldo inicial</span><b>${money(ses.saldo_inicial)}</b></div>
      <div class="kpi"><span>Ingresos</span><b>${money(ing)}</b></div>
      <div class="kpi"><span>Egresos</span><b>${money(egr)}</b></div>
      <div class="kpi"><span>Saldo actual</span><b>${money(saldo)}</b></div>
    </div></div>
    <div class="card"><h2 style="font-size:14px;margin-bottom:8px">Movimientos de hoy (${movs.length})</h2>
      <table class="grid"><thead><tr><th>Concepto</th><th>Categoría</th><th>Método</th><th class="num">Monto</th></tr></thead>
      <tbody>${movs.map(m => `<tr><td>${esc(m.descripcion || (m.tipo === 'ingreso' ? 'Ingreso' : 'Egreso'))}</td><td>${esc(m.categoria)}</td><td>${esc(m.metodo || '')}</td>
        <td class="num" style="color:${m.tipo === 'ingreso' ? '#1F6B45' : '#A33A3A'}">${m.tipo === 'ingreso' ? '+' : '−'} ${money(m.monto)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin movimientos.</td></tr>'}</tbody></table></div>`;
  $('#cerrar').onclick = async () => { if (!confirm('¿Cerrar la caja del día?')) return; const r = await data.closeCashSession(ses.id); toast('Caja cerrada · saldo ' + money(r.saldo_final)); renderCaja(); };
}

/* ── Cobros por trabajo ── */
async function renderCobros() {
  pane.innerHTML = '<div class="card">Cargando…</div>';
  const [cards, byCard] = await Promise.all([data.listProductionCards(), data.paymentsByCard()]);
  const rows = cards.filter(c => n(c.total_venta) > 0).map(c => {
    const pagado = byCard[c.id] || 0, total = n(c.total_venta), saldo = total - pagado;
    const estado = (total > 0 && saldo <= 0.01) ? 'SI' : (pagado > 0 ? 'SEÑA' : 'NO');
    return { c, pagado, total, saldo, estado };
  });
  pane.innerHTML = `<div class="card"><h2 style="font-size:14px;margin-bottom:10px">Cobros por trabajo</h2>
    <table class="grid"><thead><tr><th>Cliente</th><th class="num">Total</th><th class="num">Cobrado</th><th class="num">Saldo</th><th>Estado</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.c.client_name)}</td><td class="num">${money(r.total)}</td><td class="num">${money(r.pagado)}</td>
      <td class="num">${money(r.saldo)}</td><td><span class="pay pay-${r.estado}">${r.estado}</span></td>
      <td><button class="btn sm green" data-cobro="${r.c.id}">+ Cobro</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No hay trabajos con monto.</td></tr>'}</tbody></table></div>`;
  pane.querySelectorAll('[data-cobro]').forEach(b => b.onclick = () => cobroModal(rows.find(r => r.c.id === b.dataset.cobro)));
}
function cobroModal(r) {
  $('#modal').innerHTML = `<h2>Registrar cobro</h2>
    <div class="muted" style="margin-bottom:10px">${esc(r.c.client_name)} · saldo ${money(r.saldo)}</div>
    <div class="fg"><label>Tipo</label><select id="p-tipo"><option value="sena">Seña</option><option value="saldo">Saldo</option><option value="total">Pago total</option></select></div>
    <div class="fg"><label>Monto $</label><input id="p-monto" type="number" value="${Math.max(0, Math.round(r.saldo))}"></div>
    <div class="fg"><label>Método</label><select id="p-metodo"><option>Efectivo</option><option>Transferencia</option><option>MercadoPago</option></select></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn green" id="p-save">Registrar</button><button class="btn sm" id="p-cancel" style="margin-left:auto">Cancelar</button></div>`;
  $('#ov').classList.add('show');
  $('#p-cancel').onclick = () => $('#ov').classList.remove('show');
  $('#p-save').onclick = async () => {
    const monto = n($('#p-monto').value); if (monto <= 0) { toast('Monto inválido'); return; }
    try {
      await data.registerJobPayment({ card: r.c, tipo: $('#p-tipo').value, monto, metodo: $('#p-metodo').value });
      $('#ov').classList.remove('show'); toast('Cobro registrado'); renderCobros();
    } catch (e) { toast('Error: ' + (e.message || e)); }
  };
}

/* ── Movimientos ── */
let mvFrom = '', mvTo = '';
async function renderMov() {
  const movs = await data.listCashMovements({ from: mvFrom || undefined, to: mvTo || undefined });
  pane.innerHTML = `<div class="card">
    <div class="toolbar"><label class="muted">Desde</label><input type="date" id="mf" value="${mvFrom}"><label class="muted">Hasta</label><input type="date" id="mt" value="${mvTo}">
      <button class="btn sm" id="mfilter">Filtrar</button><button class="btn primary" id="addMov" style="margin-left:auto">+ Movimiento</button></div>
    <table class="grid"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Método</th><th class="num">Monto</th></tr></thead>
    <tbody>${movs.map(m => `<tr><td>${m.fecha}</td><td>${esc(m.descripcion || '')}</td><td>${esc(m.categoria)}</td><td>${esc(m.metodo || '')}</td>
      <td class="num" style="color:${m.tipo === 'ingreso' ? '#1F6B45' : '#A33A3A'}">${m.tipo === 'ingreso' ? '+' : '−'} ${money(m.monto)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Sin movimientos.</td></tr>'}</tbody></table></div>`;
  $('#mfilter').onclick = () => { mvFrom = $('#mf').value; mvTo = $('#mt').value; renderMov(); };
  $('#addMov').onclick = movModal;
}
function movModal() {
  $('#modal').innerHTML = `<h2>Nuevo movimiento</h2>
    <div class="fg"><label>Tipo</label><select id="m-tipo"><option value="egreso">Egreso</option><option value="ingreso">Ingreso</option></select></div>
    <div class="fg"><label>Categoría</label><select id="m-cat"><option value="compra_materiales">Compra de materiales</option><option value="sueldo">Sueldo</option><option value="transporte">Transporte</option><option value="venta">Venta</option><option value="otro">Otro</option></select></div>
    <div class="fg"><label>Monto $</label><input id="m-monto" type="number" value="0"></div>
    <div class="fg"><label>Método</label><select id="m-metodo"><option>Efectivo</option><option>Transferencia</option><option>MercadoPago</option></select></div>
    <div class="fg"><label>Descripción</label><input id="m-desc" placeholder="(opcional)"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="m-save">Guardar</button><button class="btn sm" id="m-cancel" style="margin-left:auto">Cancelar</button></div>`;
  $('#ov').classList.add('show');
  $('#m-cancel').onclick = () => $('#ov').classList.remove('show');
  $('#m-save').onclick = async () => {
    const monto = n($('#m-monto').value); if (monto <= 0) { toast('Monto inválido'); return; }
    try {
      await data.registerCashMovement({ tipo: $('#m-tipo').value, categoria: $('#m-cat').value, monto, metodo: $('#m-metodo').value, descripcion: $('#m-desc').value });
      $('#ov').classList.remove('show'); toast('Movimiento guardado'); renderMov();
    } catch (e) { toast('Error: ' + (e.message || e)); }
  };
}

/* ── Balance ── */
let blFrom = today().slice(0, 8) + '01', blTo = today();
async function renderBalance() {
  const rep = await data.cashReport({ from: blFrom, to: blTo });
  pane.innerHTML = `<div class="card">
    <div class="toolbar"><label class="muted">Desde</label><input type="date" id="bf" value="${blFrom}"><label class="muted">Hasta</label><input type="date" id="bt" value="${blTo}"><button class="btn sm" id="bfilter">Filtrar</button></div>
    <div class="kpis">
      <div class="kpi"><span>Ingresos</span><b>${money(rep.ingresos)}</b></div>
      <div class="kpi"><span>Egresos</span><b>${money(rep.egresos)}</b></div>
      <div class="kpi" style="background:${rep.neto >= 0 ? '#1F6B45' : '#A33A3A'}"><span>Resultado</span><b>${money(rep.neto)}</b></div>
    </div></div>
    <div class="card"><h2 style="font-size:14px;margin-bottom:8px">Por categoría</h2>
    <table class="grid"><tbody>${Object.entries(rep.porCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${money(v)}</td></tr>`).join('') || '<tr><td class="muted">Sin datos en el período.</td></tr>'}</tbody></table></div>`;
  $('#bfilter').onclick = () => { blFrom = $('#bf').value; blTo = $('#bt').value; renderBalance(); };
}
/* ══════════════════════════════════════════════════════════════════════
   CUENTAS A COBRAR / FACTURA INTERNA
   Cada pedido que entra a Producción abre su cuenta. No es un comprobante
   fiscal: es el registro económico del trabajo. SIN IVA.
   ══════════════════════════════════════════════════════════════════════ */
const ESTADOS_COBRO = {
  a_cobrar: { label: 'A cobrar', color: '#5A5F66', bg: '#EFEFEF' },
  parcial:  { label: 'Parcialmente cobrado', color: '#8A6D1B', bg: '#FAEFD6' },
  cobrado:  { label: 'Cobrado', color: '#1F6B45', bg: '#E1F5EE' },
  vencido:  { label: 'Vencido', color: '#A33A3A', bg: '#FDECEE' },
  anulado:  { label: 'Anulado', color: '#9AA0A6', bg: '#F2F2F2' },
};
function chipEstado(e) {
  const x = ESTADOS_COBRO[e] || ESTADOS_COBRO.a_cobrar;
  return `<span class="pay" style="background:${x.bg};color:${x.color}">${x.label}</span>`;
}

let receivables = [], prodCards = [];
async function cargarCuentas() {
  [receivables, prodCards] = await Promise.all([data.listReceivables(), data.listProductionCards()]);
}
async function renderCuentas() {
  await cargarCuentas();
  const tot = receivables.reduce((a, r) => { a.monto += n(r.monto); a.cobrado += n(r.cobrado); a.saldo += n(r.saldo); return a; },
    { monto: 0, cobrado: 0, saldo: 0 });
  const vencidas = receivables.filter(r => r.estado === 'vencido');
  pane.innerHTML = `
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><span>Facturado interno</span><b>${money(tot.monto)}</b></div>
      <div class="kpi"><span>Cobrado</span><b>${money(tot.cobrado)}</b></div>
      <div class="kpi"><span>Pendiente de cobro</span><b>${money(tot.saldo)}</b></div>
      <div class="kpi" style="background:${vencidas.length ? '#A33A3A' : '#0A0A0A'}"><span>Vencidas</span><b>${vencidas.length}</b></div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;margin-bottom:10px">Cuentas a cobrar (${receivables.length})</h2>
      <div style="overflow-x:auto"><table class="grid"><thead><tr>
        <th>Cliente</th><th>Pedido</th><th class="num">Monto</th><th class="num">Cobrado</th><th class="num">Saldo</th>
        <th>Forma de cobro</th><th>Fecha esperada</th><th>Estado</th><th></th></tr></thead>
      <tbody>${receivables.map(r => `<tr data-id="${r.id}">
        <td><b>${esc(r.cliente_nombre || '—')}</b></td>
        <td><a href="/production.html?card=${esc(r.production_card_id)}" style="color:var(--tinta)">${esc(r.production_card_id || '—')}</a></td>
        <td class="num">${money(r.monto)}</td><td class="num">${money(r.cobrado)}</td>
        <td class="num"><b>${money(r.saldo)}</b></td>
        <td>${esc({ sena_saldo: 'Seña + saldo', credito_entrega: 'Crédito hasta la entrega', fecha_pactada: 'Fecha pactada' }[r.forma_cobro] || r.forma_cobro)}</td>
        <td>${esc(r.fecha_esperada_cobro || '—')}</td>
        <td>${chipEstado(r.estado)}</td>
        <td><button class="btn sm" data-edit="${r.id}">Editar</button></td>
      </tr>`).join('') || '<tr><td colspan="9" class="muted">Todavía no hay cuentas a cobrar. Se crean solas cuando un lead ganado pasa a Producción.</td></tr>'}
      </tbody></table></div>
    </div>`;
  pane.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => cuentaModal(receivables.find(r => r.id === b.dataset.edit)));
}
function cuentaModal(r) {
  if (!r) return;
  $('#modal').innerHTML = `<h2>Cuenta a cobrar</h2>
    <div class="muted" style="margin-bottom:10px">${esc(r.cliente_nombre || '')} · ${esc(r.production_card_id || '')} · ${money(r.monto)}</div>
    <div class="fg"><label>Forma de cobro</label><select id="r-forma">
      <option value="credito_entrega" ${r.forma_cobro === 'credito_entrega' ? 'selected' : ''}>Crédito hasta la entrega</option>
      <option value="sena_saldo" ${r.forma_cobro === 'sena_saldo' ? 'selected' : ''}>Seña + saldo a la entrega</option>
      <option value="fecha_pactada" ${r.forma_cobro === 'fecha_pactada' ? 'selected' : ''}>Fecha de cobro establecida</option>
    </select></div>

let calCobroMes = new Date();
async function renderCalCobros() {
  await cargarCuentas();
  const y = calCobroMes.getFullYear(), m = calCobroMes.getMonth();
  const mesStr = `${y}-${String(m + 1).padStart(2, '0')}`;
  const sinFecha = receivables.filter(r => !r.fecha_esperada_cobro);
  const delMes = receivables.filter(r => (r.fecha_esperada_cobro || '').slice(0, 7) === mesStr);
  const porDia = {};
  delMes.forEach(r => (porDia[+r.fecha_esperada_cobro.slice(8, 10)] = porDia[+r.fecha_esperada_cobro.slice(8, 10)] || []).push(r));
  const first = new Date(y, m, 1), startDow = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const hoyS = today();
  const dows = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  let cells = dows.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="day empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${mesStr}-${String(d).padStart(2, '0')}`;
    const evs = (porDia[d] || []).map(r => {
      const x = ESTADOS_COBRO[r.estado] || ESTADOS_COBRO.a_cobrar;
      return `<div class="ev" data-id="${r.id}" style="background:${x.color}" title="${esc(r.cliente_nombre)} · ${money(r.saldo)} · ${x.label}">${esc(r.cliente_nombre || '—')} ${money(r.saldo)}</div>`;
    }).join('');
    cells += `<div class="day ${ds === hoyS ? 'today' : ''}"><div class="dn">${d}</div>${evs}</div>`;
  }
  const totalMes = delMes.reduce((s, r) => s + n(r.saldo), 0);
  pane.innerHTML = `<div class="card">
    <div class="toolbar">
      <button class="btn sm" id="ccprev">‹</button>
      <b style="min-width:160px;text-align:center;text-transform:capitalize">${calCobroMes.toLocaleDateString('es-UY', { month: 'long', year: 'numeric' })}</b>
      <button class="btn sm" id="ccnext">›</button>
      <span class="muted">Pendiente del mes: <b>${money(totalMes)}</b></span>
    </div>
    <div class="cal">${cells}</div>
    <div class="leyenda">
      ${Object.entries(ESTADOS_COBRO).filter(([k]) => k !== 'anulado').map(([k, v]) => `<span><i style="background:${v.color}"></i>${v.label}</span>`).join('')}
    </div>
  </div>
  ${sinFecha.length ? `<div class="card"><h2 style="font-size:14px;margin-bottom:8px">Sin fecha de cobro (${sinFecha.length})</h2>
    <p class="muted" style="margin-bottom:8px">Todo pedido tiene que tener fecha prevista de cobro. Estos todavía no la tienen.</p>
    <table class="grid"><tbody>${sinFecha.map(r => `<tr data-id="${r.id}">
      <td>${esc(r.cliente_nombre)}</td><td class="num">${money(r.saldo)}</td>
      <td><button class="btn sm" data-edit="${r.id}">Poner fecha</button></td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#ccprev').onclick = () => { calCobroMes = new Date(y, m - 1, 1); render('calcobros'); };
  $('#ccnext').onclick = () => { calCobroMes = new Date(y, m + 1, 1); render('calcobros'); };
  pane.querySelectorAll('.ev').forEach(e => e.onclick = () => cuentaModal(receivables.find(r => r.id === e.dataset.id)));
  pane.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => cuentaModal(receivables.find(r => r.id === b.dataset.edit)));
}

        <th class="num">Amort./mes</th><th class="num">Acumulada</th><th class="num">Valor contable</th><th>Estado</th><th></th></tr></thead>
        <tbody>${assets.map(a => `<tr data-id="${a.id}">
          <td><b>${esc(a.nombre)}</b></td><td>${esc(a.categoria || '—')}</td><td>${esc(a.fecha_compra)}</td>
          <td class="num">${money(a.costo)}</td><td class="num">${a.vida_util_meses} m</td>
          <td class="num">${money(a.valor_residual)}</td>
          <td class="num">${money(a.amortizacion_mensual)}</td><td class="num">${money(a.amortizacion_acumulada)}</td>
          <td class="num"><b>${money(a.valor_contable)}</b></td><td>${esc(a.estado)}</td>
          <td><button class="btn sm" data-adel="${a.id}">✕</button></td>
        </tr>`).join('') || '<tr><td colspan="11" class="muted">Sin activos cargados.</td></tr>'}</tbody></table></div>
      <p class="muted" style="margin-top:10px">Amortización lineal: (costo − valor residual) ÷ vida útil en meses.
        El gasto por amortización se imputa al Estado de Resultados del Dashboard.</p>
    </div>`;
  $('#aAdd').onclick = () => activoModal();
  pane.querySelectorAll('[data-adel]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar el activo?')) return;
    try { await data.deleteAsset(b.dataset.adel); toast('Eliminado'); render('activos'); }
    catch (e) { fail(e, 'No se pudo eliminar'); }
  });
}
function activoModal() {
  $('#modal').innerHTML = `<h2>Nuevo activo</h2>
    <div class="fg"><label>Nombre</label><input id="a-nombre" placeholder="Soldadora MIG"></div>
    <div class="fg"><label>Categoría</label><input id="a-cat" placeholder="Maquinaria, herramientas, vehículos…"></div>
    <div class="fg"><label>Fecha de compra</label><input id="a-fecha" type="date" value="${today()}"></div>
    <div class="fg"><label>Costo</label><input id="a-costo" type="number" value="0"></div>
    <div class="fg"><label>Vida útil (meses)</label><input id="a-vida" type="number" value="60"></div>
    <div class="fg"><label>Valor residual</label><input id="a-res" type="number" value="0"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="a-save">Guardar</button>
      <button class="btn sm" id="a-cancel" style="margin-left:auto">Cancelar</button></div>`;
  $('#ov').classList.add('show');
  $('#a-cancel').onclick = () => $('#ov').classList.remove('show');
  $('#a-save').onclick = async () => {
    if (!$('#a-nombre').value.trim()) { toast('Falta el nombre'); return; }
    const btn = $('#a-save'); btn.disabled = true;
    try {
      await data.upsertAsset({
        nombre: $('#a-nombre').value.trim(), categoria: $('#a-cat').value || null,
        fecha_compra: $('#a-fecha').value || today(), costo: n($('#a-costo').value),
        vida_util_meses: parseInt($('#a-vida').value, 10) || 60, valor_residual: n($('#a-res').value),
        metodo: 'lineal', estado: 'activo',
      });
      $('#ov').classList.remove('show'); toast('Activo guardado'); render('activos');
    } catch (e) { fail(e, 'No se pudo guardar'); btn.disabled = false; }
  };
}

$('#ov').onclick = e => { if (e.target === $('#ov')) $('#ov').classList.remove('show'); };
</script>
</body>
</html>
