<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>De Cirene · Inicio</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cirene-theme.css">
<style>
body { background: var(--bg, #f6f9fc); font-family: 'Public Sans', system-ui, sans-serif; margin: 0; }
.home-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 22px 80px; }
.home-hdr { text-align: center; margin-bottom: 36px; }
.home-hdr h1 { font-family: 'Raleway', sans-serif; font-size: 32px; color: var(--azul); margin: 0 0 6px; }
.home-hdr p { color: var(--tinta-3); margin: 0; font-size: 14px; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--border, #e6eaf0); border-radius: 14px;
  padding: 28px 18px; text-decoration: none; color: var(--tinta, #14213d);
  transition: transform .15s, box-shadow .15s, border-color .15s;
  text-align: center; min-height: 150px;
}
.tile:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 22px rgba(0, 0, 0,.10);
  border-color: var(--azul);
}
.tile .icon { line-height: 1; margin-bottom: 12px; color: var(--azul, #0A0A0A); }
.tile:hover .icon { color: var(--azul, #0A0A0A); }
.tile .label { font-size: 16px; font-weight: 700; }
.tile .desc { font-size: 11px; color: var(--tinta-3); margin-top: 4px; }
.tile.admin-only { background: linear-gradient(135deg, #fff, #F0F0EF); border-color: var(--azul); }
/* centro de actividad */
.actividad { background: #fff; border: 1px solid var(--border, #e6eaf0); border-radius: 14px; padding: 16px 18px; margin-bottom: 24px; }
.actividad .ah { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.actividad .ah h2 { font-size: 15px; margin: 0; font-family: 'Raleway', sans-serif; }
.actividad .badge { background: #A33A3A; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 8px; }
.actividad .btn { margin-left: auto; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border-2, #ccc); background: #fff; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.noti { display: flex; gap: 10px; align-items: flex-start; padding: 9px 2px; border-bottom: 1px solid var(--surface-3, #f0f0f0); font-size: 13px; }
.noti:last-child { border-bottom: none; }
.noti.no-leida { font-weight: 600; }
.noti .dot { width: 8px; height: 8px; border-radius: 50%; background: #A33A3A; margin-top: 6px; flex: 0 0 auto; }
.noti .dot.leida { background: transparent; }
.noti .cuerpo { flex: 1; min-width: 0; }
.noti .cuerpo .txt { font-weight: 400; color: var(--tinta-2, #5A5F66); font-size: 12px; }
.noti .when { font-size: 11px; color: var(--tinta-3, #9AA0A6); white-space: nowrap; }
.noti a { color: inherit; text-decoration: none; }
.noti a:hover { text-decoration: underline; }
.tile .cnt { position: absolute; }
@media (max-width: 480px) {
  .home-wrap { padding: 20px 12px 60px; }
  .home-hdr h1 { font-size: 24px; }
  .tile { min-height: 110px; padding: 18px 12px; }
  .tile .icon { font-size: 32px; }
  .tile .label { font-size: 14px; }
}
</style>
</head>
<body>

<div id="navbar-mount"></div>

<div class="home-wrap">
  <div class="home-hdr">
    <h1>De&nbsp;C&#x0268;rene</h1>
    <p id="welcomeText">Cargando…</p>
  </div>
  <div id="actividad"></div>
  <div class="tile-grid" id="tileGrid"></div>
</div>

<script type="module">
import { renderNavbar } from './js/navbar.js?v=5';
import { requireAuth, isAdmin, getProfile } from './js/auth.js?v=5';
import { icon } from './js/icons.js?v=5';
import * as data from './js/cirene-data.js?v=5';

const TILES = [
  { id: 'intake',   icon: 'inbox',      label: 'CRM / Leads',  href: '/intake.html',        desc: 'Consultas y seguimiento' },
  { id: 'clientes', icon: 'users',      label: 'Clientes',     href: '/clientes.html',      desc: 'Tu cartera de clientes' },
  { id: 'cot',      icon: 'calculator', label: 'Cotizar',      href: '/index.html',         desc: 'Presupuesto + PDF' },
  { id: 'catalog',  icon: 'package',    label: 'Catálogo',     href: '/catalog.html',       desc: 'Materiales, terminaciones y tarifas' },
  { id: 'prod',     icon: 'clipboard',  label: 'Producción',   href: '/production.html',    desc: 'Kanban, semana y subtareas' },
  { id: 'stock',    icon: 'stock',      label: 'Stock',        href: '/stock.html',         desc: 'Existencias y movimientos' },
  { id: 'compras',  icon: 'oc',         label: 'Compras',      href: '/compras.html',       desc: 'Proveedores y órdenes', adminOnly: true },
  { id: 'ventas',   icon: 'chart',      label: 'Ventas',       href: '/ventas.html',        desc: 'KPIs e indicadores' },
  { id: 'nps',      icon: 'trending',   label: 'NPS',          href: '/nps.html',           desc: 'Satisfacción de clientes' },
  { id: 'conta',    icon: 'file',       label: 'Contabilidad', href: '/contabilidad.html',  desc: 'Cobros, gastos y activos', adminOnly: true },
  { id: 'dash',     icon: 'metrics',    label: 'Dashboard',    href: '/dashboard.html',     desc: 'Resumen ejecutivo', adminOnly: true },
  { id: 'admin',    icon: 'settings',   label: 'Admin',        href: '/admin.html',         desc: 'Operarios, cargas y usuarios', adminOnly: true },
];

const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cuando = (iso) => {
  if (!iso) return '';
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  if (min < 1440) return `hace ${Math.round(min / 60)} h`;
  return d.toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit' });
};

(async () => {
  await requireAuth();
  renderNavbar('home');
  const admin = await isAdmin();
  const profile = await getProfile();
  const name = profile?.vendor_name || profile?.full_name || profile?.email || 'De Cirene';
  document.getElementById('welcomeText').textContent = `Hola ${name}, ¿qué hacés hoy?`;

  const grid = document.getElementById('tileGrid');
  grid.innerHTML = TILES
    .filter(t => admin || !t.adminOnly)
    .map(t => `
      <a class="tile ${t.adminOnly ? 'admin-only' : ''}" href="${t.href}">
        <div class="icon">${icon(t.icon, { size: 40, stroke: 1.6 })}</div>
        <div class="label">${t.label}</div>
        ${t.desc ? `<div class="desc">${t.desc}</div>` : ''}
      </a>`)
    .join('');

  pintarActividad();
})();

/* ───────── Centro de actividad ─────────
   Comentarios donde participé, respuestas nuevas y alertas. Si algo falla, el
   bloque simplemente no se muestra: nunca deja el Inicio colgado. */
async function pintarActividad() {
  const cont = document.getElementById('actividad');
  let notis = [];
  try { notis = await data.listNotifications({ limite: 12 }); }
  catch (e) { console.warn('[inicio] notificaciones', e); cont.innerHTML = ''; return; }
  const sinLeer = notis.filter(x => !x.leida).length;
  if (!notis.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = `<div class="actividad">
    <div class="ah"><h2>Actividad</h2>
      ${sinLeer ? `<span class="badge">${sinLeer} sin leer</span>` : ''}
      ${sinLeer ? '<button class="btn" id="leerTodo">Marcar todo como leído</button>' : ''}
    </div>
    ${notis.map(x => `<div class="noti ${x.leida ? '' : 'no-leida'}" data-id="${x.id}">
      <span class="dot ${x.leida ? 'leida' : ''}"></span>
      <div class="cuerpo">
        ${x.url ? `<a href="${esc(x.url)}">${esc(x.titulo)}</a>` : esc(x.titulo)}
        ${x.cuerpo ? `<div class="txt">${esc(x.cuerpo)}</div>` : ''}
      </div>
      <span class="when">${cuando(x.created_at)}</span>
    </div>`).join('')}
  </div>`;
  const btn = document.getElementById('leerTodo');
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    try { await data.markAllNotificationsRead(); pintarActividad(); }
    catch (e) { console.warn(e); btn.disabled = false; }
  };
  cont.querySelectorAll('.noti.no-leida').forEach(el => el.onclick = () => {
    data.markNotificationRead(el.dataset.id).catch(() => {});
    el.classList.remove('no-leida');
    el.querySelector('.dot').classList.add('leida');
  });
}
</script>
</body>
</html>
